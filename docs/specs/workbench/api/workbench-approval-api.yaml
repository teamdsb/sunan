openapi: 3.0.3
info:
  title: Workbench Approval API
  version: 2.1.0
  description: >-
    工作平台审批桥接口，定义企业微信审批发起、回调、查询、对账、重试与管理员诊断能力。
servers:
  - url: /api/v1
paths:
  /wecom/approval/launch:
    post:
      summary: 发起企业微信审批
      tags: [Workbench Approval]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LaunchApprovalRequest'
      responses:
        '200':
          description: Approval launched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalLaunchResponse'
  /wecom/approval/callback:
    post:
      summary: 接收企业微信审批回调
      tags: [Workbench Approval]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalCallbackPayload'
      responses:
        '200':
          description: Callback accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalCallbackAcceptedResponse'
  /wecom/approval/instances:
    get:
      summary: 分页检索审批实例
      tags: [Workbench Approval]
      parameters:
        - in: query
          name: processInstanceId
          schema:
            type: string
        - in: query
          name: businessRecordId
          schema:
            type: string
        - in: query
          name: moduleCode
          schema:
            type: string
        - in: query
          name: approvalSyncStatus
          schema:
            type: string
            enum: [pending, callback_received, reconciled, retrying, failed]
        - in: query
          name: externalStatus
          schema:
            type: string
            enum: [pending, approved, rejected, canceled, terminated]
        - in: query
          name: syncErrorCode
          schema:
            type: string
        - in: query
          name: source
          schema:
            type: string
            enum: [launch, callback, reconcile, retry, admin]
        - in: query
          name: dateFrom
          schema:
            type: string
            format: date
        - in: query
          name: dateTo
          schema:
            type: string
            format: date
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalInstanceListResponse'
  /wecom/approval/instances/{processInstanceId}:
    get:
      summary: 获取审批实例镜像状态
      tags: [Workbench Approval]
      parameters:
        - in: path
          name: processInstanceId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalInstanceResponse'
        '404':
          description: Instance not found
  /wecom/approval/reconcile:
    post:
      summary: 对账审批实例
      tags: [Workbench Approval]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcileApprovalsRequest'
      responses:
        '202':
          description: Reconcile queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconcileQueuedResponse'
  /wecom/approval/retry:
    post:
      summary: 对指定审批实例触发重试或补偿
      tags: [Workbench Approval]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryApprovalRequest'
      responses:
        '202':
          description: Retry queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryQueuedResponse'
components:
  schemas:
    ApprovalLaunchResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ApprovalLaunchResult'
    ApprovalCallbackAcceptedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            accepted:
              type: boolean
            processInstanceId:
              type: string
            callbackVersion:
              type: integer
    ApprovalInstanceResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ApprovalInstance'
    ApprovalInstanceListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalInstance'
        pagination:
          type: object
          properties:
            page:
              type: integer
            pageSize:
              type: integer
            total:
              type: integer
    LaunchApprovalRequest:
      type: object
      required: [moduleCode, businessRecordId, templateCode, title, applicantUserId]
      properties:
        moduleCode:
          type: string
        businessRecordId:
          type: string
        templateCode:
          type: string
        title:
          type: string
        applicantUserId:
          type: string
        summary:
          type: string
        payload:
          type: object
          additionalProperties: true
    ApprovalLaunchResult:
      type: object
      properties:
        processInstanceId:
          type: string
        approvalChannel:
          type: string
          enum: [wecom_native]
        launchStatus:
          type: string
          enum: [queued, started]
        mirrorStatus:
          type: string
          enum: [approval_pending]
        approvalSyncStatus:
          type: string
          enum: [pending]
    ApprovalCallbackPayload:
      type: object
      required: [eventId, processInstanceId, status, callbackVersion]
      properties:
        eventId:
          type: string
        processInstanceId:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected, canceled, terminated]
        callbackVersion:
          type: integer
        encrypted:
          type: boolean
        payload:
          type: object
          additionalProperties: true
    ApprovalInstance:
      type: object
      properties:
        processInstanceId:
          type: string
        businessRecordId:
          type: string
        moduleCode:
          type: string
        externalStatus:
          type: string
          enum: [pending, approved, rejected, canceled, terminated]
        mirrorStatus:
          type: string
          enum: [approval_pending, approval_passed, approval_rejected, approval_canceled, approval_terminated, approval_sync_failed]
        approvalSyncStatus:
          type: string
          enum: [pending, callback_received, reconciled, retrying, failed]
        source:
          type: string
          enum: [launch, callback, reconcile, retry, admin]
        startedAt:
          type: string
          format: date-time
        lastCallbackAt:
          type: string
          format: date-time
          nullable: true
        lastReconciledAt:
          type: string
          format: date-time
          nullable: true
        callbackVersion:
          type: integer
        retryCount:
          type: integer
        syncErrorCode:
          type: string
          nullable: true
        syncErrorMessage:
          type: string
          nullable: true
    ReconcileApprovalsRequest:
      type: object
      required: [processInstanceIds]
      properties:
        processInstanceIds:
          type: array
          items:
            type: string
        reason:
          type: string
    ReconcileQueuedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            acceptedCount:
              type: integer
            queuedAt:
              type: string
              format: date-time
    RetryApprovalRequest:
      type: object
      required: [processInstanceId]
      properties:
        processInstanceId:
          type: string
        reason:
          type: string
        strategy:
          type: string
          enum: [retry_callback_processing, fetch_instance_detail, full_reconcile]
          default: full_reconcile
    RetryQueuedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            processInstanceId:
              type: string
            accepted:
              type: boolean
            strategy:
              type: string
