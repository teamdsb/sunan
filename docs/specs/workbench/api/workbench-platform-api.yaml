openapi: 3.0.3
info:
  title: Workbench Platform API
  version: 1.0.0
  description: 工作平台平台级接口，承载模块入口、工作台首页、统一记录列表/详情/动作、附件与打印。
servers:
  - url: /api/v1
paths:
  /workbench/modules:
    get:
      summary: 获取工作平台模块列表
      tags: [Workbench]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkbenchModuleSummary'
  /workbench/dashboard:
    get:
      summary: 获取工作平台首页聚合数据
      tags: [Workbench]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkbenchDashboardResponse'
  /workbench/records:
    get:
      summary: 获取工作平台记录列表
      tags: [Workbench]
      parameters:
        - in: query
          name: moduleCode
          schema:
            type: string
        - in: query
          name: templateType
          schema:
            type: string
            enum: [ledger_form, operation_flow, inspection_rectification, attendance_statistics, service_asset, wecom_approval]
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: vesselId
          schema:
            type: string
        - in: query
          name: keyword
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWorkbenchRecords'
    post:
      summary: 创建工作平台记录
      tags: [Workbench]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkbenchRecordRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WorkbenchRecordDetail'
  /workbench/records/{recordId}:
    get:
      summary: 获取工作平台记录详情
      tags: [Workbench]
      parameters:
        - in: path
          name: recordId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WorkbenchRecordDetail'
  /workbench/records/{recordId}/actions:
    post:
      summary: 提交工作平台记录动作
      tags: [Workbench]
      parameters:
        - in: path
          name: recordId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkbenchRecordActionRequest'
      responses:
        '200':
          description: Action accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WorkbenchActionResult'
  /workbench/records/{recordId}/attachments:
    post:
      summary: 上传工作平台记录附件
      tags: [Workbench]
      parameters:
        - in: path
          name: recordId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, fileId]
              properties:
                category:
                  type: string
                  enum: [before_rectification, after_rectification, meeting_photo, evidence, document, print_export]
                stepCode:
                  type: string
                fileId:
                  type: string
                remark:
                  type: string
      responses:
        '201':
          description: Created
  /workbench/records/{recordId}/print:
    get:
      summary: 获取打印快照
      tags: [Workbench]
      parameters:
        - in: path
          name: recordId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WorkbenchPrintSnapshot'
components:
  schemas:
    WorkbenchModuleSummary:
      type: object
      required: [moduleCode, moduleName, departmentCode, templateType, pendingCount]
      properties:
        moduleCode:
          type: string
        moduleName:
          type: string
        departmentCode:
          type: string
        templateType:
          type: string
        pendingCount:
          type: integer
        requiresApproval:
          type: boolean
        supportsPrint:
          type: boolean
        supportsStatistics:
          type: boolean
    WorkbenchDashboardResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            modules:
              type: array
              items:
                $ref: '#/components/schemas/WorkbenchModuleSummary'
            pendingTotal:
              type: integer
            approvalPendingTotal:
              type: integer
            alerts:
              type: array
              items:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
    PaginatedWorkbenchRecords:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WorkbenchRecordSummary'
        pagination:
          type: object
          properties:
            page:
              type: integer
            pageSize:
              type: integer
            total:
              type: integer
    WorkbenchRecordSummary:
      type: object
      properties:
        id:
          type: string
        moduleCode:
          type: string
        title:
          type: string
        status:
          type: string
        vesselId:
          type: string
          nullable: true
        occurredAt:
          type: string
          format: date-time
        approvalChannel:
          type: string
          enum: [internal, wecom_native]
    CreateWorkbenchRecordRequest:
      type: object
      required: [moduleCode, templateCode, payload]
      properties:
        moduleCode:
          type: string
        templateCode:
          type: string
        title:
          type: string
        payload:
          type: object
          additionalProperties: true
    WorkbenchRecordDetail:
      allOf:
        - $ref: '#/components/schemas/WorkbenchRecordSummary'
        - type: object
          properties:
            summary:
              type: string
            externalProcessInstanceId:
              type: string
              nullable: true
            externalStatus:
              type: string
              nullable: true
            steps:
              type: array
              items:
                $ref: '#/components/schemas/WorkbenchStep'
            attachments:
              type: array
              items:
                $ref: '#/components/schemas/WorkbenchAttachment'
            actionLogs:
              type: array
              items:
                $ref: '#/components/schemas/WorkbenchActionLog'
            payload:
              type: object
              additionalProperties: true
    WorkbenchStep:
      type: object
      properties:
        stepCode:
          type: string
        stepName:
          type: string
        status:
          type: string
        rectificationRequired:
          type: boolean
        rectificationStatus:
          type: string
          nullable: true
    WorkbenchAttachment:
      type: object
      properties:
        id:
          type: string
        category:
          type: string
        fileName:
          type: string
        uploadedAt:
          type: string
          format: date-time
    WorkbenchActionLog:
      type: object
      properties:
        id:
          type: string
        actionType:
          type: string
        operatorUserId:
          type: string
        fromStatus:
          type: string
        toStatus:
          type: string
        createdAt:
          type: string
          format: date-time
    WorkbenchRecordActionRequest:
      type: object
      required: [actionType]
      properties:
        actionType:
          type: string
          enum: [submit, assign, start, complete_step, submit_review, request_rework, close_record, archive]
        comment:
          type: string
        payload:
          type: object
          additionalProperties: true
    WorkbenchActionResult:
      type: object
      properties:
        recordId:
          type: string
        status:
          type: string
        acceptedAction:
          type: string
    WorkbenchPrintSnapshot:
      type: object
      properties:
        businessRecordId:
          type: string
        templateVersion:
          type: string
        renderedFileId:
          type: string
        renderedAt:
          type: string
          format: date-time
        snapshotData:
          type: object
          additionalProperties: true
