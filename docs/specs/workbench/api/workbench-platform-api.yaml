                  personKey: { type: string }
                  personName: { type: string }
                  departmentCode: { type: string }
                  departmentName: { type: string }
                  days: { type: integer }
                  workHours: { type: number }
                  missingHours: { type: integer }
            details:
              type: array
              items:
                type: object
                properties:
                  recordId: { type: string }
                  recordNo: { type: string }
                  personKey: { type: string }
                  personName: { type: string }
                  departmentCode: { type: string }
                  departmentName: { type: string }
                  vesselName: { type: string }
                  occurredAt: { type: string, description: 上海本地日期时间 }
                  period: { type: string, enum: [am, pm] }
