openapi: 3.0.3
info:
  title: Workbench Platform API
  version: 2.1.0
  description: >-
    工作平台平台级接口，覆盖模块入口、模块 schema、首页聚合、统一记录列表/详情/动作、
    附件、证据、受控打印快照，以及真实考勤明细导出、个人学习进度、燃油月报与财务对账接口。
servers:
  - url: /api/v1
paths:
  /workbench/inspection-people:
    get:
      tags: [Workbench]
      summary: 获取自查可分配人员（仅管理人员）
      description: 返回当前企业中已登录且可用的船员和管理人员，不返回其他个人资料。
      responses:
        '200':
          description: 可分配人员
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        userId: { type: string }
                        name: { type: string }
                        canExecute: { type: boolean }
                        canReview: { type: boolean }
        '403':
          description: 当前用户无分配权限
  /workbench/modules:
    get:
      summary: 获取工作平台模块列表
      tags: [Workbench]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkbenchModulesResponse'
  /workbench/modules/{moduleCode}/schema:
    get:
      summary: 获取工作平台模块 schema
      tags: [Workbench]
      parameters:
        - in: path
          name: moduleCode
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkbenchModuleSchemaResponse'
        '404':
          description: Module schema not found
  /workbench/dashboard:
    get:
      summary: 获取工作平台首页聚合数据
      tags: [Workbench]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkbenchDashboardResponse'
  /workbench/records:
    get:
      summary: 获取工作平台记录列表
      tags: [Workbench]
      parameters:
        - in: query
          name: moduleCode
          schema:
            type: string
        - in: query
          name: templateType
          schema:
            type: string
            enum:
              [
                ledger_form,
                operation_flow,
                inspection_rectification,
                attendance_statistics,
                service_asset,
                wecom_approval,
              ]
        - in: query
          name: requiresApproval
          schema:
            type: boolean
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: vesselId
          schema:
            type: string
        - in: query
          name: ownerUserId
          schema:
            type: string
        - in: query
          name: keyword
          schema:
            type: string
        - in: query
          name: dateFrom
          description: 日期时间控件输入；不接受只有日期的值
          schema:
            type: string
            format: date-time
        - in: query
          name: dateTo
          description: 日期时间控件输入；不接受只有日期的值
          schema:
            type: string
            format: date-time
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWorkbenchRecords'
    post:
      summary: 创建工作平台记录
      tags: [Workbench]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkbenchRecordRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkbenchRecordDetailResponse'
  /workbench/records/{recordId}:
    get:
      summary: 获取工作平台记录详情
      tags: [Workbench]
      parameters:
        - in: path
          name: recordId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkbenchRecordDetailResponse'
        '404':
          description: Record not found
  /workbench/records/{recordId}/actions:
    post:
      summary: 提交工作平台记录动作
      tags: [Workbench]
      description: >-
        通用动作入口。`goa_training` 在 `actionType=update_payload` 且学习状态满足完成条件时，
        系统会自动发起审批并将记录状态切换为 `approval_pending`。
      parameters:
        - in: path
          name: recordId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkbenchRecordActionRequest'
      responses:
        '200':
          description: Action accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkbenchActionResultResponse'
  /workbench/records/{recordId}/attachments:
    post:
      summary: 上传工作平台记录附件
      tags: [Workbench]
      parameters:
        - in: path
          name: recordId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadWorkbenchAttachmentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkbenchAttachmentResponse'
  /workbench/records/{recordId}/attachments/{fileId}/download-url:
    get:
      summary: 获取已绑定工作台附件的短期下载地址
      tags: [Workbench]
      parameters:
        - in: path
          name: recordId
          required: true
          schema:
            type: string
        - in: path
          name: fileId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 仅在记录可见且附件绑定关系存在时返回
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDownloadUrlResponse'
        '403':
          description: 当前用户不可读取该记录
        '404':
          description: 记录、附件或绑定关系不存在
  /workbench/records/{recordId}/print:
    get:
      summary: 获取工作平台记录的打印快照
      tags: [Workbench]
      parameters:
        - in: path
          name: recordId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkbenchPrintSnapshotResponse'
  /workbench/records/{recordId}/issues:
    get:
      summary: 获取检查整改记录的受权统一问题回链
      tags: [Workbench]
      parameters:
        - in: path
          name: recordId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 仅返回调用者同时有来源记录和问题读取权限的关联问题
        '403':
          description: 无权读取来源记录或关联问题
        '404':
          description: Record not found
  /workbench/statistics/attendance:
    get:
      description: 按上海时区月份及当前账号可见范围汇总；未知工时保留为 null。
      summary: 获取月度考勤统计
      tags: [Workbench Statistics]
      parameters:
        - in: query
          name: month
          required: false
          schema:
            type: string
            example: 2026-04
        - in: query
          name: departmentCode
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceStatisticsResponse'
  /workbench/statistics/attendance/export:
    get:
      summary: 导出月度考勤统计
      description: 冻结请求时可见范围及实际业务明细；XLSX 包含人员汇总、逐日考勤、考勤明细，PDF 包含人员与记录明细。仅有导出权限的账号可创建，下载和重试限创建人或系统管理员。
      tags: [Workbench Statistics]
      parameters:
        - in: query
          name: month
          required: true
          schema:
            type: string
            example: 2026-04
        - in: query
          name: departmentCode
          schema:
            type: string
        - in: query
          name: exportFormat
          schema:
            type: string
            enum: [xlsx, pdf]
            default: xlsx
      responses:
        '202':
          description: Export queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceExportQueuedResponse'
  /workbench/statistics/attendance/reconcile:
    post:
      summary: 发起月度考勤财务对账
      tags: [Workbench Statistics]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceReconcileRequest'
      responses:
        '202':
          description: Reconcile accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceReconcileResponse'
  /workbench/learning/people:
    get:
      summary: 获取可下发学习的真实成员
      tags: [Workbench Business]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningPeopleResponse'
        '400':
          description: 参数或业务数据无效
        '403':
          description: 无权访问或执行
  /workbench/statistics/learning:
    get:
      summary: 汇总可见课程的个人进度与学时
      tags: [Workbench Business]
      parameters:
        - in: query
          name: month
          description: 上海月份；学习不传为全部课程，燃油不传为当前月
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningStatisticsResponse'
        '400':
          description: 参数或业务数据无效
        '403':
          description: 无权访问或执行
  /workbench/statistics/learning/export:
    get:
      summary: 导出个人学时及学习明细
      tags: [Workbench Business]
      parameters:
        - in: query
          name: month
          description: 上海月份；学习不传为全部课程，燃油不传为当前月
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessDownloadResponse'
        '400':
          description: 参数或业务数据无效
        '403':
          description: 无权访问或执行
  /workbench/records/{recordId}/learning/publish:
    post:
      summary: 冻结学习内容并分配实际成员
      tags: [Workbench Business]
      parameters:
        - in: path
          name: recordId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearningPublishRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningResponse'
        '400':
          description: 参数或业务数据无效
        '403':
          description: 无权访问或执行
        '409':
          description: 记录状态不允许本次操作
  /workbench/records/{recordId}/learning/confirm:
    post:
      summary: 当前成员确认已学习指定材料
      tags: [Workbench Business]
      parameters:
        - in: path
          name: recordId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearningConfirmRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningResponse'
        '400':
          description: 参数或业务数据无效
        '403':
          description: 无权访问或执行
        '409':
          description: 记录状态不允许本次操作
  /workbench/statistics/fuel:
    get:
      summary: 按实收与测量计算燃油月报
      tags: [Workbench Business]
      parameters:
        - in: query
          name: month
          description: 上海月份；学习不传为全部课程，燃油不传为当前月
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FuelStatisticsResponse'
        '400':
          description: 参数或业务数据无效
        '403':
          description: 无权访问或执行
  /workbench/statistics/fuel/export:
    get:
      summary: 导出月报及实际加注明细
      tags: [Workbench Business]
      parameters:
        - in: query
          name: month
          description: 上海月份；学习不传为全部课程，燃油不传为当前月
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessDownloadResponse'
        '400':
          description: 参数或业务数据无效
        '403':
          description: 无权访问或执行
  /workbench/records/{recordId}/fuel-actual:
    post:
      summary: 登记或更正审批通过的实际加注
      tags: [Workbench Business]
      parameters:
        - in: path
          name: recordId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FuelActualRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessObjectResponse'
        '400':
          description: 参数或业务数据无效
        '403':
          description: 无权访问或执行
        '409':
          description: 记录状态不允许本次操作
  /workbench/fuel/measurements:
    post:
      summary: 登记或更正月末实测余量
      tags: [Workbench Business]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FuelMeasurementRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessObjectResponse'
        '400':
          description: 参数或业务数据无效
        '403':
          description: 无权访问或执行
        '409':
          description: 记录状态不允许本次操作
components:
  schemas:
    WorkbenchModulesResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WorkbenchModuleSummary'
    WorkbenchModuleSchemaResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/WorkbenchModuleSchema'
    WorkbenchRecordDetailResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/WorkbenchRecordDetail'
    WorkbenchActionResultResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/WorkbenchActionResult'
    WorkbenchAttachmentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/WorkbenchAttachment'
    WorkbenchPrintSnapshotResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/WorkbenchPrintSnapshot'
    WorkbenchModuleSummary:
      type: object
      required:
        [
          moduleCode,
          moduleName,
          departmentCode,
          templateType,
          pendingCount,
          requiresApproval,
          supportsPrint,
          supportsStatistics,
          mobileFirst,
        ]
      properties:
        moduleCode:
          type: string
        moduleName:
          type: string
        departmentCode:
          type: string
        templateType:
          type: string
          enum:
            [
              ledger_form,
              operation_flow,
              inspection_rectification,
              attendance_statistics,
              service_asset,
              wecom_approval,
            ]
        pendingCount:
          type: integer
        requiresApproval:
          type: boolean
        supportsPrint:
          type: boolean
        supportsStatistics:
          type: boolean
        mobileFirst:
          type: boolean
    WorkbenchDashboardResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            modules:
              type: array
              items:
                $ref: '#/components/schemas/WorkbenchModuleSummary'
            pendingTotal:
              type: integer
            approvalPendingTotal:
              type: integer
            alerts:
              type: array
              items:
                $ref: '#/components/schemas/WorkbenchAlert'
    WorkbenchAlert:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    WorkbenchModuleSchema:
      type: object
      required: [moduleCode, templateType, sections]
      properties:
        moduleCode:
          type: string
        templateType:
          type: string
          enum:
            [
              ledger_form,
              operation_flow,
              inspection_rectification,
              attendance_statistics,
              service_asset,
              wecom_approval,
            ]
        sections:
          type: array
          items:
            $ref: '#/components/schemas/WorkbenchSection'
        stepTemplates:
          type: array
          items:
            $ref: '#/components/schemas/WorkbenchStepTemplate'
    WorkbenchSection:
      type: object
      required: [key, title, fields]
      properties:
        key:
          type: string
        title:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/WorkbenchField'
    WorkbenchField:
      type: object
      required: [key, label, required, inputType]
      properties:
        key:
          type: string
        label:
          type: string
        required:
          type: boolean
        inputType:
          type: string
          enum: [text, number, date, textarea, select, image, file]
        placeholder:
          type: string
    WorkbenchStepTemplate:
      type: object
      required: [stepCode, stepName]
      properties:
        stepCode:
          type: string
        stepName:
          type: string
    PaginatedWorkbenchRecords:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WorkbenchRecordSummary'
        pagination:
          $ref: '#/components/schemas/Pagination'
    Pagination:
      type: object
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    WorkbenchRecordSummary:
      type: object
      required:
        [
          id,
          moduleCode,
          title,
          status,
          occurredAt,
          approvalChannel,
          recordSource,
        ]
      properties:
        id:
          type: string
        moduleCode:
          type: string
        title:
          type: string
        status:
          type: string
        vesselId:
          type: string
          nullable: true
        occurredAt:
          type: string
          format: date-time
        approvalChannel:
          type: string
          enum: [internal, wecom_native]
        recordSource:
          type: string
          enum: [manual, callback, reconcile]
    CreateWorkbenchRecordRequest:
      description: >-
        shipping_self_inspection 必须由管理人员创建，vesselId、assigneeUserId、reviewerUserId 必填；
        执行人和审核人必须是同企业的可用人员且不能相同。payload 必须包含 inspectionScope 和 deadline。
        船名由后端从 vesselId 读取。自查使用固定三步骤，不通过通用模板配置改变审核规则。
      type: object
      required: [moduleCode, title, summary]
      properties:
        moduleCode:
          type: string
        title:
          type: string
        summary:
          type: string
        vesselId:
          type: string
          nullable: true
        assigneeUserId:
          type: string
          maxLength: 64
        reviewerUserId:
          type: string
          maxLength: 64
        occurredAt:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
    WorkbenchRecordDetail:
      allOf:
        - $ref: '#/components/schemas/WorkbenchRecordSummary'
        - type: object
          properties:
            availableActions:
              type: array
              description: 按当前用户分工与状态计算；自查前端只显示这些动作。
              items: { type: string }
            ownerUserId: { type: string }
            assigneeUserId: { type: string, nullable: true }
            reviewerUserId: { type: string, nullable: true }
            assigneeName: { type: string }
            reviewerName: { type: string }
            summary:
              type: string
            externalProcessInstanceId:
              type: string
              nullable: true
            externalStatus:
              type: string
              nullable: true
            steps:
              type: array
              items:
                $ref: '#/components/schemas/WorkbenchStep'
            attachments:
              type: array
              items:
                $ref: '#/components/schemas/WorkbenchAttachment'
            actionLogs:
              type: array
              items:
                $ref: '#/components/schemas/WorkbenchActionLog'
            payload:
              type: object
              additionalProperties: true
    WorkbenchStep:
      type: object
      properties:
        id:
          type: string
        completedBy: { type: string, nullable: true }
        stepPayload:
          type: object
          additionalProperties: true
          description: 保存执行说明、退回原因及本轮重新上传证据的时间下限。
        stepCode:
          type: string
        stepName:
          type: string
        status:
          type: string
          enum: [pending, in_progress, completed, skipped]
        rectificationRequired:
          type: boolean
        rectificationStatus:
          type: string
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
    WorkbenchAttachment:
      type: object
      properties:
        id:
          type: string
        category:
          type: string
        stepCode:
          type: string
          nullable: true
        fileId:
          type: string
        fileName:
          type: string
        mimeType:
          type: string
        fileSize:
          type: integer
          minimum: 0
        uploadedAt:
          type: string
          format: date-time
    FileDownloadUrlResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [downloadUrl, expiresAt]
          properties:
            downloadUrl:
              type: string
              format: uri
            expiresAt:
              type: string
              format: date-time
    WorkbenchActionLog:
      type: object
      properties:
        id:
          type: string
        actionType:
          type: string
        source:
          type: string
          enum: [manual, callback, reconcile, system]
        operatorUserId:
          type: string
          nullable: true
        fromStatus:
          type: string
          nullable: true
        toStatus:
          type: string
          nullable: true
        comment:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    WorkbenchRecordActionRequest:
      description: >-
        自查仅支持 assign、start、complete_step、request_rework、close_record、void。
        assign 的 payload 为 assigneeUserId/reviewerUserId，重新分配会重启检查；
        complete_step 只能操作当前执行步骤，现场检查需 checkResult=conforming/nonconforming；
        除 start 外所有动作必须填写 comment。检查不合格需整改前照片，整改提交需本轮整改后照片。
        审核仅由独立审核人执行，关闭前检查及整改必须完成。通用 submit_review、参与人和外部审批入口不能绕过规则。
        状态冲突返回 409，角色不符返回 403；关闭或作废后只读。
      type: object
      required: [actionType]
      properties:
        actionType:
          type: string
          enum:
            [
              submit,
              assign,
              start,
              complete_step,
              submit_review,
              request_rework,
              close_record,
              archive,
              void,
              retry_export,
              reconcile_record,
              refresh_print_snapshot,
              update_payload,
            ]
        comment:
          type: string
        payload:
          type: object
          additionalProperties: true
    WorkbenchActionResult:
      type: object
      properties:
        recordId:
          type: string
        status:
          type: string
        acceptedAction:
          type: string
    UploadWorkbenchAttachmentRequest:
      type: object
      required: [category, fileId]
      properties:
        category:
          type: string
          enum:
            [
              before_rectification,
              after_rectification,
              meeting_photo,
              evidence,
              document,
              print_export,
              export_file,
            ]
        stepCode:
          type: string
        fileId:
          type: string
        remark:
          type: string
    WorkbenchPrintSnapshot:
      type: object
      properties:
        recordId:
          type: string
        templateVersion:
          type: string
        renderedFileId:
          type: string
          nullable: true
        renderedFormat:
          type: string
          enum: [pdf, html_snapshot]
        renderedAt:
          type: string
          format: date-time
        downloadUrl:
          type: string
          format: uri
          description: 仅在记录级 ABAC 授权通过后返回的短期下载地址
        businessNo:
          type: string
        watermark:
          type: string
        snapshotData:
          type: object
          additionalProperties: true
    AttendanceStatisticsResponse:
