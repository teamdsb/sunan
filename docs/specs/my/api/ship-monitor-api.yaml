openapi: 3.0.3
info:
  title: Ship Monitor API
  version: 1.0.0
  description: 船舶监控模块 API 规格。
servers:
  - url: /api/v1
tags:
  - name: ShipMonitors
security:
  - bearerAuth: []
paths:
  /ship-monitors:
    get:
      tags: [ShipMonitors]
      summary: 获取监控端口列表
      parameters:
        - name: vesselId
          in: query
          schema:
            type: string
            format: uuid
        - name: activeOnly
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ShipMonitor'
    post:
      tags: [ShipMonitors]
      summary: 创建监控端口
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipMonitorCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipMonitorDetailResponse'
  '/ship-monitors/{id}':
    get:
      tags: [ShipMonitors]
      summary: 获取监控端口详情
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipMonitorDetailResponse'
    patch:
      tags: [ShipMonitors]
      summary: 更新监控端口
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipMonitorUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipMonitorDetailResponse'
    delete:
      tags: [ShipMonitors]
      summary: 删除监控端口
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: No Content
  '/ship-monitors/vessels/{vesselId}':
    get:
      tags: [ShipMonitors]
      summary: 按船舶查询监控端口
      parameters:
        - name: vesselId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ShipMonitor'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ShipMonitor:
      type: object
      properties:
        id:
          type: string
          format: uuid
        vesselId:
          type: string
          format: uuid
        vesselName:
          type: string
        monitorName:
          type: string
        endpointUrl:
          type: string
          format: uri
        accessMode:
          type: string
          enum: [external, embed]
        sortOrder:
          type: integer
        isActive:
          type: boolean
        lastVerifiedAt:
          type: string
          format: date-time
          nullable: true
    ShipMonitorCreateRequest:
      type: object
      required: [vesselId, monitorName, endpointUrl]
      properties:
        vesselId:
          type: string
          format: uuid
        monitorName:
          type: string
        endpointUrl:
          type: string
          format: uri
        accessMode:
          type: string
          enum: [external, embed]
        sortOrder:
          type: integer
    ShipMonitorUpdateRequest:
      type: object
      properties:
        monitorName:
          type: string
        endpointUrl:
          type: string
          format: uri
        accessMode:
          type: string
          enum: [external, embed]
        sortOrder:
          type: integer
        isActive:
          type: boolean
    ShipMonitorDetailResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ShipMonitor'
