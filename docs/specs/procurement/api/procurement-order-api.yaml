openapi: 3.0.3
info:
  title: Procurement Order API
  version: 1.0.0
paths:
  /api/v1/procurement/orders:
    get:
      summary: 查询采购单列表
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: keyword
          schema:
            type: string
        - in: query
          name: departmentCode
          schema:
            type: string
            enum:
              [
                general_office,
                business_dept,
                finance_dept,
                shipping_dept,
                logistics_dept,
              ]
        - in: query
          name: dimensionType
          schema:
            type: string
            enum: [none, vessel, logistics_category]
        - in: query
          name: dimensionKey
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [draft, submitted, dept_approved, final_approved, rejected]
        - in: query
          name: approvalChannel
          schema:
            type: string
            enum: [internal, wecom_native]
        - in: query
          name: submittedFrom
          description: 提交时间起始（仅支持近 3 年范围）
          schema:
            type: string
            format: date-time
        - in: query
          name: submittedTo
          description: 提交时间截止（仅支持近 3 年范围）
          schema:
            type: string
            format: date-time
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcurementOrderListResponse'
    post:
      summary: 新建采购单草稿
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcurementOrderCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcurementOrderDetailResponse'
  /api/v1/procurement/orders/{id}:
    get:
      summary: 获取采购单详情
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcurementOrderDetailResponse'
    patch:
      summary: 更新采购单草稿
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcurementOrderUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcurementOrderDetailResponse'
  /api/v1/procurement/orders/{id}/submit:
    post:
      summary: 提交采购单进入审批
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcurementOrderDetailResponse'
  /api/v1/procurement/orders/{id}/resubmit:
    post:
      summary: 退回后重新提交采购单
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcurementOrderDetailResponse'
  /api/v1/procurement/orders/{id}/attachments:
    post:
      summary: 绑定采购单附件
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcurementOrderAttachmentBindRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcurementOrderDetailResponse'
  /api/v1/procurement/orders/{id}/attachments/{fileId}:
    delete:
      summary: 解除采购单附件关联（不删除 OSS 对象或 files 元数据）
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: fileId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcurementOrderAttachmentUnlinkRequest'
      responses:
        '204':
          description: 关联已解除并已审计
        '403':
          description: 无采购单查看或草稿编辑权限
        '404':
          description: 采购单或订单—文件关联不存在
        '422':
          description: 采购单不是草稿或解除原因无效
  /api/v1/procurement/orders/{id}/attachments/{fileId}/download-url:
    get:
      summary: 获取已绑定采购单附件的短期下载地址
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: fileId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 仅在采购单查看权限和附件绑定关系校验通过后返回
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDownloadUrlResponse'
        '403':
          description: 无采购单查看权限
        '404':
          description: 采购单、文件或订单—文件关联不存在
  /api/v1/procurement/orders/{id}/print:
    post:
      summary: 生成采购单 A4 PDF
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcurementOrderPrintResponse'
components:
  schemas:
    FileDownloadUrlResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [downloadUrl, expiresAt]
          properties:
            downloadUrl:
              type: string
              format: uri
            expiresAt:
              type: string
              format: date-time
    PaginationMeta:
      type: object
      required: [total, page, pageSize, totalPages]
      properties:
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        totalPages:
          type: integer
          minimum: 0
    ProcurementOrder:
      type: object
      required:
        - id
        - orderNo
        - departmentCode
        - dimensionType
        - title
        - summary
        - amount
        - status
        - approvalChannel
        - createdBy
        - updatedBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        orderNo:
          type: string
        departmentCode:
          type: string
          enum:
            [
              general_office,
              business_dept,
              finance_dept,
              shipping_dept,
              logistics_dept,
            ]
        dimensionType:
          type: string
          enum: [none, vessel, logistics_category]
        dimensionKey:
          type: string
          nullable: true
        title:
          type: string
        summary:
          type: string
        amount:
          type: number
          format: double
        expenseDate:
          type: string
          format: date
          nullable: true
        status:
          type: string
          enum: [draft, submitted, dept_approved, final_approved, rejected]
        approvalChannel:
          type: string
          enum: [internal, wecom_native]
        externalProcessInstanceId:
          type: string
          nullable: true
        externalStatus:
          type: string
          nullable: true
        externalSyncedAt:
          type: string
          format: date-time
          nullable: true
        submittedAt:
          type: string
          format: date-time
          nullable: true
        finalApprovedAt:
          type: string
          format: date-time
          nullable: true
        createdBy:
          type: string
        updatedBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProcurementOrderDetailResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ProcurementOrder'
    ProcurementOrderListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProcurementOrder'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    ProcurementOrderAttachmentBindRequest:
      type: object
      required: [fileIds]
      properties:
        fileIds:
          type: array
          items:
            type: string
            format: uuid
    ProcurementOrderAttachmentUnlinkRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: 解除当前采购单关联的原因；不会删除 OSS 对象或全局文件元数据
    ProcurementOrderPrintResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [fileId, downloadUrl]
          properties:
            fileId:
              type: string
              format: uuid
            downloadUrl:
              type: string
    ProcurementOrderCreateRequest:
      type: object
      required:
        - departmentCode
        - title
        - summary
        - amount
      properties:
        departmentCode:
          type: string
          enum:
            [
              general_office,
              business_dept,
              finance_dept,
              shipping_dept,
              logistics_dept,
            ]
        dimensionType:
          type: string
          enum: [none, vessel, logistics_category]
          default: none
        dimensionKey:
          type: string
          nullable: true
        title:
          type: string
          maxLength: 128
        summary:
          type: string
        amount:
          type: number
          format: double
        expenseDate:
          type: string
          format: date-time
          nullable: true
          description: 日期时间控件输入；服务端按业务时区保存为费用日
        approvalChannel:
          type: string
          enum: [internal, wecom_native]
          default: internal
    ProcurementOrderUpdateRequest:
      type: object
      properties:
        dimensionType:
          type: string
          enum: [none, vessel, logistics_category]
        dimensionKey:
          type: string
          nullable: true
        title:
          type: string
          maxLength: 128
        summary:
          type: string
        amount:
          type: number
          format: double
        expenseDate:
          type: string
          format: date-time
          nullable: true
          description: 日期时间控件输入；服务端按业务时区保存为费用日
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
