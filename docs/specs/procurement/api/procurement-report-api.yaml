openapi: 3.0.3
info:
  title: Procurement Report API
  version: 1.0.0
paths:
  /api/v1/procurement/reports/monthly:
    get:
      summary: 查询月度采购报表
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: year
          required: true
          description: 仅支持近 3 年（含当年）
          schema:
            type: integer
            minimum: 2000
        - in: query
          name: month
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - in: query
          name: departmentCode
          schema:
            type: string
            enum: [general_office, business_dept, finance_dept, shipping_dept, logistics_dept]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyReportResponse'
  /api/v1/procurement/reports/yearly:
    get:
      summary: 查询年度采购报表（含月趋势）
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: year
          required: true
          description: 仅支持近 3 年（含当年）
          schema:
            type: integer
            minimum: 2000
        - in: query
          name: departmentCode
          schema:
            type: string
            enum: [general_office, business_dept, finance_dept, shipping_dept, logistics_dept]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YearlyReportResponse'
  /api/v1/procurement/reports/department-details:
    get:
      summary: 查询部门采购明细
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: departmentCode
          required: true
          schema:
            type: string
            enum: [general_office, business_dept, finance_dept, shipping_dept, logistics_dept]
        - in: query
          name: startDate
          required: true
          description: 明细查询起始日期（仅支持近 3 年范围）
          schema:
            type: string
            format: date-time
        - in: query
          name: endDate
          required: true
          description: 明细查询截止日期（仅支持近 3 年范围）
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentDetailsResponse'
  /api/v1/procurement/reports/dimension-details:
    get:
      summary: 查询部门细分采购明细（船舶/后勤）
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: departmentCode
          required: true
          schema:
            type: string
            enum: [shipping_dept, logistics_dept]
        - in: query
          name: dimensionType
          required: true
          schema:
            type: string
            enum: [vessel, logistics_category]
        - in: query
          name: dimensionKey
          schema:
            type: string
        - in: query
          name: startDate
          required: true
          description: 明细查询起始日期（仅支持近 3 年范围）
          schema:
            type: string
            format: date-time
        - in: query
          name: endDate
          required: true
          description: 明细查询截止日期（仅支持近 3 年范围）
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DimensionDetailsResponse'
  /api/v1/procurement/report-requests:
    get:
      summary: 查询报表审批单列表
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportRequestListResponse'
    post:
      summary: 创建报表审批单草稿
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequestCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportRequestDetailResponse'
  /api/v1/procurement/report-requests/{id}:
    get:
      summary: 获取报表审批单详情
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportRequestDetailResponse'
  /api/v1/procurement/report-requests/{id}/submit:
    post:
      summary: 提交报表审批单
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportRequestDetailResponse'
  /api/v1/procurement/report-requests/{id}/print:
    post:
      summary: 生成报表审批单 A4 PDF
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportPrintResponse'
components:
  schemas:
    ReportSummaryItem:
      type: object
      properties:
        label:
          type: string
        amount:
          type: number
          format: double
        orderCount:
          type: integer
          minimum: 0
    ReportDetailItem:
      type: object
      properties:
        orderId:
          type: string
          format: uuid
        orderNo:
          type: string
        departmentCode:
          type: string
        dimensionType:
          type: string
        dimensionKey:
          type: string
          nullable: true
        title:
          type: string
        amount:
          type: number
          format: double
        status:
          type: string
        submittedAt:
          type: string
          format: date-time
          nullable: true
    MonthlyReportResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [year, month, items]
          properties:
            year:
              type: integer
            month:
              type: integer
            items:
              type: array
              items:
                $ref: '#/components/schemas/ReportSummaryItem'
    YearlyReportResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [year, items]
          properties:
            year:
              type: integer
            items:
              type: array
              items:
                $ref: '#/components/schemas/ReportSummaryItem'
    DepartmentDetailsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReportDetailItem'
    DimensionDetailsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReportDetailItem'
    ReportRequest:
      type: object
      required:
        - id
        - reportNo
        - reportType
        - periodYear
        - status
        - approvalChannel
        - snapshotParams
        - snapshotSummary
        - createdBy
        - updatedBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        reportNo:
          type: string
        reportType:
          type: string
          enum: [monthly, yearly]
        periodYear:
          type: integer
          minimum: 2000
        periodMonth:
          type: integer
          minimum: 1
          maximum: 12
          nullable: true
        departmentCode:
          type: string
          nullable: true
          enum: [general_office, business_dept, finance_dept, shipping_dept, logistics_dept]
        snapshotParams:
          type: object
          additionalProperties: true
        snapshotSummary:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [draft, submitted, dept_approved, finance_approved, final_approved, rejected]
        approvalChannel:
          type: string
          enum: [internal, wecom_native]
        externalProcessInstanceId:
          type: string
          nullable: true
        externalStatus:
          type: string
          nullable: true
        externalSyncedAt:
          type: string
          format: date-time
          nullable: true
        submittedAt:
          type: string
          format: date-time
          nullable: true
        finalApprovedAt:
          type: string
          format: date-time
          nullable: true
        exportPdfFileId:
          type: string
          format: uuid
          nullable: true
        createdBy:
          type: string
        updatedBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ReportRequestDetailResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ReportRequest'
    ReportRequestListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReportRequest'
    ReportPrintResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [fileId, downloadUrl]
          properties:
            fileId:
              type: string
              format: uuid
            downloadUrl:
              type: string
    ReportRequestCreate:
      type: object
      required:
        - reportType
        - periodYear
      properties:
        reportType:
          type: string
          enum: [monthly, yearly]
        periodYear:
          type: integer
          minimum: 2000
        periodMonth:
          type: integer
          minimum: 1
          maximum: 12
          nullable: true
        departmentCode:
          type: string
          nullable: true
          enum: [general_office, business_dept, finance_dept, shipping_dept, logistics_dept]
        approvalChannel:
          type: string
          enum: [internal, wecom_native]
          default: internal
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
