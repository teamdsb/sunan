openapi: 3.0.3
info:
  title: Procurement Report API
  version: 1.0.0
paths:
  /api/v1/procurement/reports/monthly:
    get:
      summary: 查询月度采购报表
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: year
          required: true
          schema:
            type: integer
            minimum: 2000
        - in: query
          name: month
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - in: query
          name: departmentCode
          schema:
            type: string
            enum: [general_office, business_dept, finance_dept, shipping_dept, logistics_dept]
      responses:
        '200':
          description: OK
  /api/v1/procurement/reports/yearly:
    get:
      summary: 查询年度采购报表（含月趋势）
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: year
          required: true
          schema:
            type: integer
            minimum: 2000
        - in: query
          name: departmentCode
          schema:
            type: string
            enum: [general_office, business_dept, finance_dept, shipping_dept, logistics_dept]
      responses:
        '200':
          description: OK
  /api/v1/procurement/reports/department-details:
    get:
      summary: 查询部门采购明细
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: departmentCode
          required: true
          schema:
            type: string
            enum: [general_office, business_dept, finance_dept, shipping_dept, logistics_dept]
        - in: query
          name: startDate
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
  /api/v1/procurement/reports/dimension-details:
    get:
      summary: 查询部门细分采购明细（船舶/后勤）
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: departmentCode
          required: true
          schema:
            type: string
            enum: [shipping_dept, logistics_dept]
        - in: query
          name: dimensionType
          required: true
          schema:
            type: string
            enum: [vessel, logistics_category]
        - in: query
          name: dimensionKey
          schema:
            type: string
        - in: query
          name: startDate
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
  /api/v1/procurement/report-requests:
    get:
      summary: 查询报表审批单列表
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
    post:
      summary: 创建报表审批单草稿
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequestCreate'
      responses:
        '201':
          description: Created
  /api/v1/procurement/report-requests/{id}:
    get:
      summary: 获取报表审批单详情
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
  /api/v1/procurement/report-requests/{id}/submit:
    post:
      summary: 提交报表审批单
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Created
  /api/v1/procurement/report-requests/{id}/print:
    post:
      summary: 生成报表审批单 A4 PDF
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Created
components:
  schemas:
    ReportRequestCreate:
      type: object
      required:
        - reportType
        - periodYear
      properties:
        reportType:
          type: string
          enum: [monthly, yearly]
        periodYear:
          type: integer
          minimum: 2000
        periodMonth:
          type: integer
          minimum: 1
          maximum: 12
          nullable: true
        departmentCode:
          type: string
          nullable: true
          enum: [general_office, business_dept, finance_dept, shipping_dept, logistics_dept]
        approvalChannel:
          type: string
          enum: [internal, wecom_native]
          default: internal
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
