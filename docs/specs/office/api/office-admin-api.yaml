openapi: 3.0.3
info:
  title: Office Admin API
  version: 1.0.0
paths:
  /api/v1/office/admin/audits:
    get:
      summary: 查询办事入口审计记录
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: entryId
          schema:
            type: string
            format: uuid
        - in: query
          name: action
          schema:
            type: string
            enum: [create, update, publish, disable, open]
        - in: query
          name: operatorUserId
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: OK
  /api/v1/office/admin/entries:
    get:
      summary: 查询治理端办事入口
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
    post:
      summary: 新增办事入口
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Created
  /api/v1/office/admin/entries/{id}:
    patch:
      summary: 更新办事入口
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
  /api/v1/office/admin/entries/{id}/publish:
    post:
      summary: 发布办事入口
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Created
  /api/v1/office/admin/entries/{id}/disable:
    post:
      summary: 停用办事入口
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Created
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
