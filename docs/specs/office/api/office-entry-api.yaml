openapi: 3.0.3
info:
  title: Office Entry API
  version: 1.0.0
paths:
  /api/v1/office/categories:
    get:
      summary: 获取办事分类
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
  /api/v1/office/entries:
    get:
      summary: 查询办事入口
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: keyword
          schema:
            type: string
        - in: query
          name: categoryCode
          schema:
            type: string
      responses:
        '200':
          description: OK
  /api/v1/office/entries/{id}:
    get:
      summary: 获取办事入口详情
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
  /api/v1/office/entries/{id}/open:
    post:
      summary: 记录办事入口打开行为并返回跳转信息
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Created
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
