services:
  sunan-db:
    build:
      context: ${SUNAN_SOURCE_DIR}
      dockerfile: docker/postgres/Dockerfile
    image: sunan-db:16-stable
    container_name: sunan-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - /dev/sunan/sunan-db/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sunan

  sunan-redis:
    build:
      context: ${SUNAN_SOURCE_DIR}
      dockerfile: docker/redis/Dockerfile
    image: sunan-redis:7.4-stable
    container_name: sunan-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--user",
        "default",
        "off",
        "--user",
        "${REDIS_USER}",
        "on",
        ">${REDIS_PASSWORD}",
        "~*",
        "&*",
        "+@all",
      ]
    volumes:
      - /dev/sunan/sunan-redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--user", "${REDIS_USER}", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sunan

  sunan-oss:
    build:
      context: ${SUNAN_SOURCE_DIR}
      dockerfile: docker/oss/Dockerfile
    image: sunan-oss:2025-09-07-stable
    container_name: sunan-oss
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${OSS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${OSS_ACCESS_KEY_SECRET}
      MINIO_BROWSER_REDIRECT_URL: https://oss-console.qzssncb.com
      MINIO_SERVER_URL: https://oss.qzssncb.com
      TZ: Asia/Shanghai
    volumes:
      - /dev/sunan/sunan-oss/data:/data
    networks:
      - sunan

  sunan-oss-init:
    build:
      context: ${SUNAN_SOURCE_DIR}
      dockerfile: docker/oss-mc/Dockerfile
    image: sunan-oss-mc:2025-08-13-stable
    container_name: sunan-oss-init
    depends_on:
      - sunan-oss
    entrypoint: >
      /bin/sh -c "
      until mc alias set sunan http://sunan-oss:9000 ${OSS_ACCESS_KEY_ID} ${OSS_ACCESS_KEY_SECRET}; do sleep 2; done;
      mc mb -p sunan/${OSS_BUCKET} || true;
      mc anonymous set none sunan/${OSS_BUCKET} || true;
      "
    networks:
      - sunan

  sunan-api:
    build:
      context: ${SUNAN_SOURCE_DIR}
      dockerfile: apps/api/Dockerfile
      labels:
        org.opencontainers.image.version: ${SUNAN_VERSION:-0.0.3}
    image: sunan-api:${SUNAN_VERSION:-stable}
    container_name: sunan-api
    restart: unless-stopped
    labels:
      org.opencontainers.image.version: ${SUNAN_VERSION:-0.0.3}
    env_file:
      - /dev/sunan/deploy/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: sunan-db
      DB_PORT: 5432
      DB_SSL: "false"
      REDIS_URL: redis://sunan-redis:6379
      REDIS_USERNAME: ${REDIS_USER}
      OSS_DRIVER: s3
      OSS_ENDPOINT: http://sunan-oss:9000
      OSS_PUBLIC_ENDPOINT: https://oss.qzssncb.com
      OSS_FORCE_PATH_STYLE: "true"
      WECOM_CALLBACK_ALLOWED_IP_RANGES_FILE: ${WECOM_CALLBACK_ALLOWED_IP_RANGES_FILE:-/run/sunan/wecom-ips/callback-ip-list.txt}
    command: >
      sh -c "node dist/database/run-migrations.js &&
             node dist/database/seeds/run-seed.js &&
             node dist/main.js"
    depends_on:
      sunan-db:
        condition: service_healthy
      sunan-redis:
        condition: service_healthy
      sunan-oss-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - /dev/sunan/sunan-api/logs:/app/logs
      - /dev/sunan/sunan-wecom-ips:/run/sunan/wecom-ips:ro
    networks:
      - sunan

  sunan-web:
    build:
      context: ${SUNAN_SOURCE_DIR}
      dockerfile: apps/web/Dockerfile
      labels:
        org.opencontainers.image.version: ${SUNAN_VERSION:-0.0.3}
      args:
        VITE_API_BASE_URL: https://api.qzssncb.com/api/v1
        VITE_WECOM_CORP_ID: ${WECOM_CORP_ID}
        VITE_WECOM_AGENT_ID: ${WECOM_AGENT_ID}
        VITE_WECOM_REDIRECT_URI: https://app.qzssncb.com/auth/callback
    image: sunan-web:${SUNAN_VERSION:-stable}
    container_name: sunan-web
    restart: unless-stopped
    labels:
      org.opencontainers.image.version: ${SUNAN_VERSION:-0.0.3}
    depends_on:
      sunan-api:
        condition: service_healthy
    networks:
      - sunan

  sunan-nginx:
    build:
      context: ${SUNAN_SOURCE_DIR}
      dockerfile: docker/nginx/Dockerfile
      labels:
        org.opencontainers.image.version: ${SUNAN_VERSION:-0.0.3}
    image: sunan-nginx:${SUNAN_VERSION:-stable}
    container_name: sunan-nginx
    restart: unless-stopped
    labels:
      org.opencontainers.image.version: ${SUNAN_VERSION:-0.0.3}
    depends_on:
      sunan-web:
        condition: service_started
      sunan-api:
        condition: service_healthy
      sunan-oss:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /dev/sunan/sunan-nginx/conf.d:/etc/nginx/conf.d:ro
      - /dev/sunan/sunan-nginx/certs:/etc/nginx/certs:ro
      - /dev/sunan/sunan-nginx/acme:/var/www/certbot:ro
      - /dev/sunan/sunan-wecom-ips:/etc/nginx/wecom:ro
      - /dev/sunan/sunan-nginx/logs:/var/log/nginx
    networks:
      - sunan

networks:
  sunan:
    name: sunan
