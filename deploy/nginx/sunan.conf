map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

map $http_origin $sunan_oss_cors_origin {
  default "";
  "https://app.qzssncb.com" $http_origin;
}

server {
  listen 80;
  server_name qzssncb.com *.qzssncb.com;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
  }

  location = /WW_verify_syXtjgUoSgMs7TpJ.txt {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name qzssncb.com;

  ssl_certificate /etc/nginx/certs/qzssncb.com.crt;
  ssl_certificate_key /etc/nginx/certs/qzssncb.com.key;

  location = /WW_verify_syXtjgUoSgMs7TpJ.txt {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    return 301 https://app.qzssncb.com$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name app.qzssncb.com;

  ssl_certificate /etc/nginx/certs/qzssncb.com.crt;
  ssl_certificate_key /etc/nginx/certs/qzssncb.com.key;

  access_log /var/log/nginx/app.access.log;
  error_log /var/log/nginx/app.error.log warn;

  location = /WW_verify_syXtjgUoSgMs7TpJ.txt {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    proxy_pass http://sunan-web:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name api.qzssncb.com;

  ssl_certificate /etc/nginx/certs/qzssncb.com.crt;
  ssl_certificate_key /etc/nginx/certs/qzssncb.com.key;

  client_max_body_size 100m;
  access_log /var/log/nginx/api.access.log;
  error_log /var/log/nginx/api.error.log warn;

  location = /api/v1/wecom/callback {
    include /etc/nginx/wecom/callback-allow.conf;
    deny all;

    proxy_pass http://sunan-api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/v1/wecom/approval/callback {
    include /etc/nginx/wecom/callback-allow.conf;
    deny all;

    proxy_pass http://sunan-api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://sunan-api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name oss.qzssncb.com;

  ssl_certificate /etc/nginx/certs/qzssncb.com.crt;
  ssl_certificate_key /etc/nginx/certs/qzssncb.com.key;

  ignore_invalid_headers off;
  client_max_body_size 1024m;
  proxy_buffering off;
  proxy_request_buffering off;
  access_log /var/log/nginx/oss.access.log;
  error_log /var/log/nginx/oss.error.log warn;

  location / {
    add_header Access-Control-Allow-Origin $sunan_oss_cors_origin always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Methods "GET, PUT, POST, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "authorization,content-type,x-amz-content-sha256,x-amz-date,x-amz-meta-original-name,x-amz-security-token" always;
    add_header Access-Control-Max-Age 86400 always;
    add_header Vary Origin always;

    if ($request_method = OPTIONS) {
      return 204;
    }

    proxy_pass http://sunan-oss:9000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name oss-console.qzssncb.com;

  ssl_certificate /etc/nginx/certs/qzssncb.com.crt;
  ssl_certificate_key /etc/nginx/certs/qzssncb.com.key;

  access_log /var/log/nginx/oss-console.access.log;
  error_log /var/log/nginx/oss-console.error.log warn;

  location / {
    proxy_pass http://sunan-oss:9001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
